<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c8f3f1" />
    <meta name="description" content="一个给某只猪使用的专属玄学答疑小程序。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=update-prompt-20260901" />
    <title>咪的答案</title>
  </head>
  <body>
    <main class="app-shell" aria-label="咪的答案">
      <section class="topbar">
        <div class="brand-duo" aria-hidden="true">
          <span class="brand-mark rabbit-mark">
            <span class="ear ear-left"></span>
            <span class="ear ear-right"></span>
            <span class="face">
              <span class="eye eye-left"></span>
              <span class="eye eye-right"></span>
              <span class="cheek cheek-left"></span>
              <span class="cheek cheek-right"></span>
            </span>
          </span>
          <span class="brand-mark cat-mark">
            <span class="cat-ear cat-ear-left"></span>
            <span class="cat-ear cat-ear-right"></span>
            <span class="cat-face">
              <span class="eye eye-left"></span>
              <span class="eye eye-right"></span>
              <span class="cat-nose"></span>
              <span class="cheek cheek-left"></span>
              <span class="cheek cheek-right"></span>
            </span>
          </span>
        </div>
        <div>
          <h1 class="app-title" aria-label="咪的答案">
            <span>咪</span><span>的</span><span>答</span><span>案</span>
          </h1>
          <p class="intro-copy" aria-label="应用介绍">
            <span>向兔兔占卜师说出你的问题</span>
            <span>兔兔占卜师会马上跑去收集星辰、露水、彩虹、花香</span>
            <span>制作出专属于你的答案</span>
            <span>如果不喜欢收到的答案</span>
            <span>那就麻烦兔兔占卜师为你重新制作一次吧</span>
          </p>
        </div>
        <div class="top-actions">
          <button id="favoriteButton" class="icon-button" type="button" aria-label="查看已收藏答案">♡</button>
          <button id="settingsButton" class="icon-button" type="button" aria-label="个人设置">⚙</button>
        </div>
      </section>

      <section class="oracle-card" aria-live="polite">
        <div class="spark spark-one"></div>
        <div class="spark spark-two"></div>
        <div class="welcome-line">
          嘛哩嘛哩哄，怪力乱神已上线，某只猪请提问
        </div>
        <div id="messages" class="messages">
        </div>
        <section id="drawPanel" class="draw-panel" hidden aria-live="polite">
          <p id="drawHint" class="draw-hint">请选择一张小牌</p>
          <div id="cardDeck" class="card-deck" aria-label="选择一张答案牌"></div>
        </section>
      </section>

      <form id="askForm" class="ask-form" autocomplete="off">
        <label class="sr-only" for="questionInput">输入问题</label>
        <input
          id="questionInput"
          name="question"
          type="text"
          placeholder="某只猪想问什么呀..."
          maxlength="80"
          required
        />
        <button type="submit" aria-label="发送问题">问</button>
      </form>

      <nav class="quick-asks" aria-label="今日签文">
        <button type="button" data-question="抽今日签文">抽今日签文</button>
      </nav>
    </main>

    <section id="authModal" class="modal-layer" aria-label="登录或注册" hidden>
      <div class="modal-card auth-card">
        <h2>小猪通行证</h2>
        <p class="tiny-note">小兔兔开个后门提醒你要设置为不重要的密码哦，因为不知道会不会有大灰狼来偷密码！登录后 7 天内会记住这只小猪。</p>
        <div class="tabs" role="tablist" aria-label="选择登录或注册">
          <button id="loginTab" type="button" class="tab active">登录</button>
          <button id="registerTab" type="button" class="tab">注册</button>
        </div>
        <form id="authForm" class="stack-form">
          <label>
            手机号
            <input id="phoneInput" type="tel" inputmode="tel" autocomplete="tel" required />
          </label>
          <label>
            密码
            <input id="passwordInput" type="password" autocomplete="current-password" required minlength="6" />
          </label>
          <label id="nicknameField" hidden>
            昵称
            <input id="nicknameInput" type="text" maxlength="18" placeholder="比如：某只猪" />
          </label>
          <button id="authSubmit" type="submit">登录</button>
        </form>
      </div>
    </section>

    <section id="profileModal" class="modal-layer" aria-label="个人信息" hidden>
      <div class="modal-card">
        <button id="closeProfile" class="close-button" type="button" aria-label="关闭">×</button>
        <h2>个人信息</h2>
        <form id="profileForm" class="stack-form">
          <label>
            头像
            <span class="avatar-upload">
              <span id="avatarPreview" class="avatar-preview" aria-hidden="true">🐷</span>
              <span class="avatar-pick">从相册选择头像</span>
              <input id="avatarInput" type="file" accept="image/*" />
              <input id="avatarValue" type="hidden" value="🐷" />
            </span>
          </label>
          <label>
            昵称
            <input id="profileNicknameInput" type="text" maxlength="18" />
          </label>
          <button type="submit">保存</button>
        </form>
        <form id="feedbackForm" class="stack-form feedback-form">
          <h3>意见反馈</h3>
          <textarea id="feedbackInput" maxlength="300" placeholder="某只猪想吐槽什么呀..."></textarea>
          <button type="submit">提交反馈</button>
        </form>
        <button id="logoutButton" class="ghost-button" type="button">退出登录</button>
      </div>
    </section>

    <section id="favoritesModal" class="modal-layer" aria-label="收藏的答案" hidden>
      <div class="modal-card favorites-card">
        <button id="closeFavorites" class="close-button" type="button" aria-label="关闭">×</button>
        <h2>收藏的答案</h2>
        <p class="tiny-note">小猪猪收进抽屉里的签文都在这里。</p>
        <div id="favoritesList" class="favorites-list"></div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="updatePrompt" class="update-prompt" role="status" hidden>
      <span>发现新版本啦，兔兔占卜师换了新魔法。</span>
      <button id="updateButton" type="button">马上更新</button>
    </div>

    <script defer src="./app.js?v=update-prompt-20260901"></script>
  </body>
</html>
